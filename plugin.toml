id           = "dox187/codexbar-meter"
name         = "CodexBar Meter (weekly)"
version      = "1.0.0"
plugin_api   = 8
author       = "dox187 (fork of salemsayed/codexbar-meter)"
license      = "MIT"
icon         = "chart-donut-3"
description  = "A native CodexBar-powered usage meter for enabled AI providers."
tags         = ["bar", "panel", "ai", "indicator", "utility"]
dependencies = ["codexbar", "timeout"]

[[setting]]
key             = "codexbarPath"
type            = "string"
label_key       = "settings.codexbar_path.label"
description_key = "settings.codexbar_path.description"
default         = "codexbar"

[[setting]]
key             = "refreshIntervalSec"
type            = "int"
label_key       = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default         = 60
min             = 30
max             = 3600

[[setting]]
key             = "barProviderLimit"
type            = "int"
label_key       = "settings.bar_provider_limit.label"
description_key = "settings.bar_provider_limit.description"
default         = 2
min             = 1
max             = 4

[[widget]]
id    = "bar"
entry = "bar_widget.luau"

# Per-instance settings, shown by middle-clicking the widget. The bar widget
# publishes mainWindow to the panel through shared plugin state.
[[widget.setting]]
key             = "mainWindow"
type            = "select"
label_key       = "settings.main_window.label"
description_key = "settings.main_window.description"
default         = "weekly"
options = [
    { value = "weekly", label_key = "settings.main_window.options.weekly" },
    { value = "codexbar", label_key = "settings.main_window.options.codexbar" },
]

[[widget.setting]]
key             = "barLabel"
type            = "select"
label_key       = "settings.bar_label.label"
description_key = "settings.bar_label.description"
default         = "reset"
options = [
    { value = "reset", label_key = "settings.bar_label.options.reset" },
    { value = "window", label_key = "settings.bar_label.options.window" },
]

[[widget.setting]]
key             = "barExtraBars"
type            = "select"
label_key       = "settings.bar_extra_bars.label"
description_key = "settings.bar_extra_bars.description"
default         = "one"
options = [
    { value = "none", label_key = "settings.bar_extra_bars.options.none" },
    { value = "one", label_key = "settings.bar_extra_bars.options.one" },
    { value = "all", label_key = "settings.bar_extra_bars.options.all" },
]

[[panel]]
id                  = "panel-compact"
entry               = "panel.luau"
width               = 430
height              = 390
placement           = "attached"
position            = "auto"
open_near_click     = true
dismiss_on_outside_click = true

[[panel]]
id                  = "panel"
entry               = "panel.luau"
width               = 430
height              = 560
placement           = "attached"
position            = "auto"
open_near_click     = true
dismiss_on_outside_click = true

[[panel]]
id                  = "panel-tall"
entry               = "panel.luau"
width               = 430
height              = 720
placement           = "attached"
position            = "auto"
open_near_click     = true
dismiss_on_outside_click = true
